<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Student Result Management System</h1>

        <form id="resultForm">

            <label for="name">Student Name</label>
            <input type="text" id="name" placeholder="Enter student name">

            <label for="roll">Roll Number</label>
            <input type="text" id="roll" placeholder="Enter roll number">

            <label for="subject1">Web Technology</label>
            <input type="number" id="subject1" min="0" max="100">

            <label for="subject2">JavaScript</label>
            <input type="number" id="subject2" min="0" max="100">

            <label for="subject3">Database</label>
            <input type="number" id="subject3" min="0" max="100">

            <label for="subject4">Computer Networks</label>
            <input type="number" id="subject4" min="0" max="100">

            <label for="subject5">Operating Systems</label>
            <input type="number" id="subject5" min="0" max="100">

            <div class="buttons">
                <button type="submit">Calculate Result</button>
                <button type="button" id="clearBtn">Clear</button>
            </div>

        </form>

        <div id="resultSection">
            <h2>Student Result</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll No.</th>
                        <th>Total</th>
                        <th>Percentage</th>
                        <th>Grade</th>
                        <th>Result</th>
                    </tr>
                </thead>

                <tbody id="resultTable">
                </tbody>
            </table>

            <button id="newStudentBtn">Enter Another Student</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
